<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>In-Car Infotainment Fitts' Law Test</title>
  <style>
    body { font-family: sans-serif; text-align: center; margin: 0; padding: 15px; background: #1a1a1a; color: #fff; }
    #canvas-container { position: relative; width: 800px; height: 500px; margin: 10px auto; background: #2b2b2b; border-radius: 12px; border: 2px solid #444; overflow: hidden; }
    .target { position: absolute; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; user-select: none; transition: transform 0.05s; }
    #start-btn { background: #4CAF50; color: white; border: 2px solid #fff; }
    #target-btn { background: #FF5722; color: white; border: 2px solid #fff; display: none; }
    .target:active { transform: scale(0.95); }
    #controls { margin-top: 15px; }
    button.export-btn { padding: 10px 20px; font-size: 16px; font-weight: bold; border-radius: 6px; border: none; cursor: pointer; background: #2196F3; color: white; }
    button.export-btn:disabled { background: #555; cursor: not-allowed; }
    #status { margin: 10px; font-size: 16px; color: #bbb; }
  </style>
</head>
<body>

  <h2>In-Car Touchscreen Pointing Experiment (Fitts' Law)</h2>
  <p id="status">Click the GREEN START button to begin trial (1/135)</p>

  <div id="canvas-container">
    <div id="start-btn" class="target">START</div>
    <div id="target-btn" class="target">A/C</div>
  </div>

  <div id="controls">
    <button class="export-btn" id="export-btn" onclick="exportCSV()" disabled>Export Results to CSV</button>
  </div>

  <script>
    // 1. 定義 27 組不同的距離 (A) 與寬度 (W) 實驗條件
    const distances = [150, 250, 350, 450, 550, 650];
    const widths = [30, 45, 60, 75, 90];
    
    let rawConditions = [];
    for (let d of distances) {
      for (let w of widths) {
        rawConditions.push({ A: d, W: w });
      }
    }
    // 挑選前 27 組獨特組合，並指定 Condition ID (1 到 27)
    const baseConditions = rawConditions.slice(0, 27).map((cond, index) => {
      return {
        conditionId: index + 1,
        A: cond.A,
        W: cond.W,
        ID: Math.log2(cond.A / cond.W + 1)
      };
    });

    // 2. 每個條件重複 5 次 (共 27 * 5 = 135 個 trials)
    const REPETITIONS = 5;
    let trials = [];
    baseConditions.forEach((c) => {
      for (let i = 0; i < REPETITIONS; i++) {
        trials.push({ ...c });
      }
    });

    // 隨機打亂測試順序以避免學習效應
    trials = trials.sort(() => Math.random() - 0.5);

    let currentTrial = 0;
    let startTime = 0;
    let rawLogs = []; // 儲存單次原始測試數據

    const startBtn = document.getElementById('start-btn');
    const targetBtn = document.getElementById('target-btn');
    const statusText = document.getElementById('status');
    const exportBtn = document.getElementById('export-btn');

    function positionStart() {
      startBtn.style.width = '60px';
      startBtn.style.height = '60px';
      startBtn.style.left = '40px';
      startBtn.style.top = '220px';
      startBtn.style.display = 'flex';
      targetBtn.style.display = 'none';
    }

    startBtn.onclick = () => {
      startBtn.style.display = 'none';
      const trial = trials[currentTrial];
      
      targetBtn.style.width = trial.W + 'px';
      targetBtn.style.height = trial.W + 'px';
      targetBtn.style.left = (40 + trial.A) + 'px';
      targetBtn.style.top = (250 - trial.W / 2) + 'px';
      targetBtn.style.display = 'flex';

      startTime = performance.now(); // 高精確度計時器
    };

    targetBtn.onclick = () => {
      const endTime = performance.now();
      const mt = endTime - startTime;
      const trial = trials[currentTrial];

      rawLogs.push({
        conditionId: trial.conditionId,
        A: trial.A,
        W: trial.W,
        ID: trial.ID,
        MT: mt
      });

      currentTrial++;
      if (currentTrial < trials.length) {
        statusText.innerText = `Trial ${currentTrial + 1} of ${trials.length}`;
        positionStart();
      } else {
        statusText.innerText = "All 135 trials completed! Click below to export averaged data.";
        targetBtn.style.display = 'none';
        exportBtn.disabled = false;
      }
    };

    // 3. 計算 27 組條件各重複 5 次後的平均值並匯出 CSV
    function exportCSV() {
      // 依 conditionId 分組計算平均
      let grouped = {};
      baseConditions.forEach(c => {
        grouped[c.conditionId] = {
          conditionId: c.conditionId,
          A: c.A,
          W: c.W,
          ID: c.ID,
          times: []
        };
      });

      rawLogs.forEach(log => {
        grouped[log.conditionId].times.push(log.MT);
      });

      // 產生格式化的 CSV 字串 (欄位名稱與 CS Field Guide 相容)
      let csvContent = "data:text/csv;charset=utf-8,";
      csvContent += "Trial,Average Distance (pixels),Width (pixels),Index of Difficulty (bits),Average Time (milliseconds)\n";

      Object.values(grouped).forEach(item => {
        const avgMT = item.times.reduce((sum, val) => sum + val, 0) / item.times.length;
        csvContent += `${item.conditionId},${item.A},${item.W},${item.ID.toFixed(3)},${avgMT.toFixed(2)}\n`;
      });

      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", "averaged_fitts_law_27_trials.csv");
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // 初始化第一個位置
    positionStart();
  </script>
</body>
</html>
